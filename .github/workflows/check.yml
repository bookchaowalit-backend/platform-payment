name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract and tests (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      python-version: ${{ matrix.python-version }}
      install-command: "true" # standard library only: the step just creates the venv for this Python
      format-check: false # follow-up: adopt ruff format
      typecheck-command: "" # follow-up: add [tool.mypy]
      test-command: bash scripts/check.sh

  # Shared workflow on the locked environment: uv sync --frozen --all-extras (uv.lock, with
  # platform-backend-core pinned to a reviewed Git commit), Ruff, mypy ([tool.mypy]) and the
  # whole pytest suite, including the PostgreSQL runtime tests formerly in shared-runtime.yml,
  # under a coverage gate; then the wheel build.
  python:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      python-version: "3.12"
      postgres: true
      format-check: false # follow-up: adopt ruff format
      # Ratchet: measured 87.06% on 2026-11-03 (ADR-0004: threshold = measured, rounded down).
      coverage-threshold: "87"
      test-command: |
        PLATFORM_TEST_DSN="$DATABASE_URL" python -m pytest -q --cov --cov-report=
        uv build --wheel --out-dir dist .

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1

  image:
    # Builds the Dockerfile and scans the image with Trivy (packages inside the image, which the
    # Trivy fs scan cannot see). Blocking: a fixable HIGH/CRITICAL finding fails CI (and so Railway's Wait for CI).
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/image-scan.yml@b9957cccb3cc202e9e1a08df01924b8270d796df # v1.6.3
