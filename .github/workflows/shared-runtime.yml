name: Shared runtime
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shared-runtime-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    # Proves the Dockerfile builds from a clean checkout. Nothing is pushed or deployed.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build container image (no push)
        run: docker build --pull --tag platform-payment:ci .
      - name: Image imports the service and runs as non-root
        run: |
          docker run --rm platform-payment:ci python -c "import platform_backend_core, platform_payment.app"
          test "$(docker run --rm platform-payment:ci id -u)" != 0
      - name: Image keeps the CLI commands and refuses live Stripe mode
        run: |
          docker run --rm platform-payment:ci python -m platform_payment --help | grep -q "serve,migrate,replay-webhooks"
          # The probe key is built from the module's own prefix inside the container;
          # no Stripe-shaped literal is written here.
          docker run --rm platform-payment:ci python -c "
          import os, subprocess, sys
          from platform_payment.live_mode import LIVE_KEY_PREFIXES
          env = dict(os.environ, PAYMENT_LIVE_PROBE=LIVE_KEY_PREFIXES[0] + 'probe')
          run = subprocess.run([sys.executable, '-m', 'platform_payment', 'serve'], env=env, capture_output=True, text=True)
          assert run.returncode == 2, run.returncode
          assert 'live Stripe mode refused' in run.stderr and 'PAYMENT_LIVE_PROBE' in run.stderr
          assert 'probe' not in run.stderr.replace('PAYMENT_LIVE_PROBE', '')
          "
