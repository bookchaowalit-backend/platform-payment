[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-payment"
version = "0.1.0"
description = "Workspace-bound durable payment API"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["platform-backend-core>=0.1.0,<0.2", "uvicorn>=0.30,<1", "stripe>=14.4,<16", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
platform-payment = "platform_payment.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests", "runtime_tests"]
pythonpath = ["src", "."]

[tool.setuptools.packages.find]
where = ["src"]
